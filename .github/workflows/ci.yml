name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node: [20, 21, 22]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Run lint
        run: npm run lint
      
      - name: Check formatting
        run: npm run format:check

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Link package
        run: npm link
      
      - name: Test CLI directly
        run: |
          tired-error "ModuleNotFoundError: No module named 'requests'"
          tired-error "Error: listen EADDRINUSE: address already in use :::3000"
          tired-error "TypeError: Cannot read properties of undefined"
      
      - name: Test piped input
        run: |
          echo "npm ERR! ERESOLVE unable to resolve dependency tree" | tired-error
      
      - name: Test JSON output
        run: |
          tired-error --json "TS2304: Cannot find name 'process'" > output.json
          cat output.json
      
      - name: Test --list
        run: tired-error --list
      
      - name: Test --help
        run: tired-error --help
